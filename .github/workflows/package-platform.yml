name: Build packages on one runner
on:
  workflow_call:
    secrets:
      PDR_SIGNING_KEY:
        required: false
    inputs:
      runner:
        required: true
        type: string
      packages:
        required: true
        type: string
      publish:
        type: boolean
        default: false
      reuse-run:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
      has-builds: ${{ steps.plan.outputs.has-builds }}
      has-publish: ${{ steps.plan.outputs.has-publish }}
      plan: ${{ steps.retain.outputs.artifact-id }}
    steps:
      - name: Read approved recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install verified Forge
        uses: ./.github/actions/setup-engine
        with:
          runner: ${{ inputs.runner }}
          revision-file: package-engine-revision
      - name: Prepare build toolchains
        uses: ./.github/actions/setup-package-tools
      - name: Plan builds, recoveries, and reuse
        id: plan
        env:
          PACKAGES: ${{ inputs.packages }}
          REUSE_RUN: ${{ inputs.reuse-run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # shellcheck disable=SC2086 # PACKAGES holds exact requests separated by spaces.
          engine-bin/rootbeer-forge ci plan $PACKAGES --reuse-run "$REUSE_RUN"
      - name: Retain the work plan
        id: retain
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: plan-${{ inputs.runner }}-${{ github.run_attempt }}
          path: plan.json
          if-no-files-found: error
      - name: Retain reused package records for discovery
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: published-records-plan-${{ inputs.runner }}-${{ github.run_attempt }}
          path: discovery-records/*.json
          if-no-files-found: ignore

  # One entry per dependency level that has builds, run one after another, so each level
  # installs the builds earlier levels made instead of compiling them again.
  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.has-builds == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        level: ${{ fromJSON(needs.plan.outputs.builds).include.*.level }}
    uses: ./.github/workflows/package-level.yml
    permissions:
      contents: read
      actions: read
    with:
      runner: ${{ inputs.runner }}
      plan: ${{ needs.plan.outputs.plan }}
      # Levels with builds are contiguous from zero, so a level indexes its own entry.
      tasks: ${{ toJSON(fromJSON(needs.plan.outputs.builds).include[matrix.level].tasks) }}

  publish:
    name: Publish
    needs: [plan, build]
    if: >-
      !cancelled() && inputs.publish && needs.plan.result == 'success' && needs.plan.outputs.has-publish == 'true'
      && github.ref == 'refs/heads/main' && vars.PUBLISH_PDR == 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    environment: package-publishing
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Read approved recipes and publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install verified Forge
        uses: ./.github/actions/setup-engine
        with:
          runner: ${{ inputs.runner }}
          revision-file: package-engine-revision
      - name: Read the work plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.plan.outputs.plan }}
          path: work
          merge-multiple: true
      - name: Find the builds to publish
        id: builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: engine-bin/rootbeer-forge ci builds work/plan.json
      - name: Download this run's builds
        if: steps.builds.outputs.ids != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.builds.outputs.ids }}
          path: builds/current
      - name: Download recovered builds
        if: steps.builds.outputs.recovered-ids != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.builds.outputs.recovered-ids }}
          run-id: ${{ steps.builds.outputs.recovered-run }}
          github-token: ${{ github.token }}
          path: builds/recovered
      - name: Install registry client
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.0
      - name: Sign and push each build
        env:
          GH_TOKEN: ${{ github.token }}
          PDR_SIGNING_KEY: ${{ secrets.PDR_SIGNING_KEY }}
        run: |
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          engine-bin/rootbeer-forge ci publish work/plan.json builds
      - name: Retain published records for discovery
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: published-records-${{ inputs.runner }}-${{ github.run_attempt }}
          path: discovery-records/*.json
          if-no-files-found: ignore
