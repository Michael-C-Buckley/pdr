name: Plan platform packages
on:
  workflow_call:
    secrets:
      PDR_SIGNING_KEY:
        required: false
    inputs:
      runner:
        required: true
        type: string
      packages:
        required: true
        type: string
      publish:
        type: boolean
        default: false
      reuse-run:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  plan:
    name: Find missing signed results
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      level_0: ${{ steps.plan.outputs.level_0 }}
      level_1: ${{ steps.plan.outputs.level_1 }}
      level_2: ${{ steps.plan.outputs.level_2 }}
      level_3: ${{ steps.plan.outputs.level_3 }}
      level_4: ${{ steps.plan.outputs.level_4 }}
      level_5: ${{ steps.plan.outputs.level_5 }}
      level_6: ${{ steps.plan.outputs.level_6 }}
      level_7: ${{ steps.plan.outputs.level_7 }}
      depth: ${{ steps.plan.outputs.depth }}
      has-work: ${{ steps.plan.outputs.has-work }}
      context: ${{ steps.tools.outputs.context }}
    steps:
      - name: Read approved recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install verified Forge
        uses: ./.github/actions/setup-engine
        with:
          runner: ${{ inputs.runner }}
          revision-file: package-engine-revision
      - name: Prepare build toolchains
        uses: ./.github/actions/setup-package-tools
        id: tools
      - name: Install registry client
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.0
      - name: Plan individual package builds
        id: plan
        env:
          PACKAGES: ${{ inputs.packages }}
          BUILD_CONTEXT: ${{ steps.tools.outputs.context }}
          PACKAGE_REGISTRY: ${{ github.repository }}
          PACKAGE_PUBLIC_KEY: ${{ vars.PDR_PUBLIC_KEY }}
          PDR_URL: ${{ vars.PDR_URL }}
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ inputs.reuse-run }}
          PACKAGE_RUNNER: ${{ inputs.runner }}
          RECORD_DIRECTORY: discovery-records
        run: python3 .github/scripts/package-jobs.py
      - name: Retain package plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: plan-${{ inputs.runner }}-${{ github.run_attempt }}
          path: package-plan.json
          if-no-files-found: error
      - name: Retain reused package records for discovery
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: published-records-plan-${{ inputs.runner }}-${{ github.run_attempt }}
          path: discovery-records/*.json
          if-no-files-found: ignore

  # Builds run in dependency levels: each level installs the builds earlier levels made in this
  # run instead of compiling them again. Empty levels are skipped.
  level-0:
    name: ${{ matrix.package }} (${{ matrix.system }})
    needs: plan
    if: needs.plan.outputs.has-work == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.level_0) }}
    uses: ./.github/workflows/package-job.yml
    secrets: &secrets
      PDR_SIGNING_KEY: ${{ inputs.publish && secrets.PDR_SIGNING_KEY || '' }}
    permissions: &permissions
      contents: read
      actions: read
      packages: write
    with: &package
      runner: ${{ inputs.runner }}
      package: ${{ matrix.package }}
      name: ${{ matrix.name }}
      key: ${{ matrix.key }}
      error: ${{ matrix.error || '' }}
      context: ${{ needs.plan.outputs.context }}
      artifact: ${{ matrix.artifact || '' }}
      reuse-run: ${{ matrix.reuse_run || inputs.reuse-run }}
      pdr-root: ${{ matrix.pdr_root || '' }}
      dependencies: ${{ matrix.dependencies || '' }}
      publish: ${{ inputs.publish }}

  level-1:
    name: ${{ matrix.package }} (${{ matrix.system }})
    needs: [plan, level-0]
    if: ${{ !cancelled() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.depth) > 1 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.level_1) }}
    uses: ./.github/workflows/package-job.yml
    secrets: *secrets
    permissions: *permissions
    with: *package

  level-2:
    name: ${{ matrix.package }} (${{ matrix.system }})
    needs: [plan, level-1]
    if: ${{ !cancelled() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.depth) > 2 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.level_2) }}
    uses: ./.github/workflows/package-job.yml
    secrets: *secrets
    permissions: *permissions
    with: *package

  level-3:
    name: ${{ matrix.package }} (${{ matrix.system }})
    needs: [plan, level-2]
    if: ${{ !cancelled() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.depth) > 3 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.level_3) }}
    uses: ./.github/workflows/package-job.yml
    secrets: *secrets
    permissions: *permissions
    with: *package

  level-4:
    name: ${{ matrix.package }} (${{ matrix.system }})
    needs: [plan, level-3]
    if: ${{ !cancelled() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.depth) > 4 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.level_4) }}
    uses: ./.github/workflows/package-job.yml
    secrets: *secrets
    permissions: *permissions
    with: *package

  level-5:
    name: ${{ matrix.package }} (${{ matrix.system }})
    needs: [plan, level-4]
    if: ${{ !cancelled() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.depth) > 5 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.level_5) }}
    uses: ./.github/workflows/package-job.yml
    secrets: *secrets
    permissions: *permissions
    with: *package

  level-6:
    name: ${{ matrix.package }} (${{ matrix.system }})
    needs: [plan, level-5]
    if: ${{ !cancelled() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.depth) > 6 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.level_6) }}
    uses: ./.github/workflows/package-job.yml
    secrets: *secrets
    permissions: *permissions
    with: *package

  level-7:
    name: ${{ matrix.package }} (${{ matrix.system }})
    needs: [plan, level-6]
    if: ${{ !cancelled() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.depth) > 7 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.level_7) }}
    uses: ./.github/workflows/package-job.yml
    secrets: *secrets
    permissions: *permissions
    with: *package
