name: Plan platform packages
on:
  workflow_call:
    secrets:
      PDR_SIGNING_KEY:
        required: false
    inputs:
      runner:
        required: true
        type: string
      packages:
        required: true
        type: string
      publish:
        type: boolean
        default: false
      reuse-run:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  plan:
    name: Plan this runner's work
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      level_0: ${{ steps.plan.outputs.level_0 }}
      level_1: ${{ steps.plan.outputs.level_1 }}
      level_2: ${{ steps.plan.outputs.level_2 }}
      level_3: ${{ steps.plan.outputs.level_3 }}
      level_4: ${{ steps.plan.outputs.level_4 }}
      level_5: ${{ steps.plan.outputs.level_5 }}
      level_6: ${{ steps.plan.outputs.level_6 }}
      level_7: ${{ steps.plan.outputs.level_7 }}
      depth: ${{ steps.plan.outputs.depth }}
      has-work: ${{ steps.plan.outputs.has-work }}
      plan: ${{ steps.retain.outputs.artifact-id }}
    steps:
      - name: Read approved recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install verified Forge
        uses: ./.github/actions/setup-engine
        with:
          runner: ${{ inputs.runner }}
          revision-file: package-engine-revision
      - name: Prepare build toolchains
        uses: ./.github/actions/setup-package-tools
      - name: Plan builds, recoveries, and reuse
        id: plan
        env:
          PACKAGES: ${{ inputs.packages }}
          REUSE_RUN: ${{ inputs.reuse-run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # shellcheck disable=SC2086 # PACKAGES holds exact requests separated by spaces.
          engine-bin/rootbeer-forge ci plan $PACKAGES --reuse-run "$REUSE_RUN"
      - name: Retain the work plan
        id: retain
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: plan-${{ inputs.runner }}-${{ github.run_attempt }}
          path: plan.json
          if-no-files-found: error
      - name: Retain reused package records for discovery
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: published-records-plan-${{ inputs.runner }}-${{ github.run_attempt }}
          path: discovery-records/*.json
          if-no-files-found: ignore

  # Builds run in dependency levels: each level installs the builds earlier levels made in this
  # run instead of compiling them again. Empty levels are skipped.
  level-0:
    name: ${{ matrix.package }} (${{ matrix.system }})
    needs: plan
    if: needs.plan.outputs.has-work == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.level_0) }}
    uses: ./.github/workflows/package-job.yml
    secrets: &secrets
      PDR_SIGNING_KEY: ${{ inputs.publish && secrets.PDR_SIGNING_KEY || '' }}
    permissions: &permissions
      contents: read
      actions: read
      packages: write
    with: &package
      runner: ${{ inputs.runner }}
      package: ${{ matrix.package }}
      name: ${{ matrix.name }}
      key: ${{ matrix.key }}
      plan: ${{ needs.plan.outputs.plan }}
      error: ${{ matrix.error || '' }}
      artifact: ${{ matrix.artifact || '' }}
      reuse-run: ${{ matrix.reuse_run || inputs.reuse-run }}
      publish: ${{ inputs.publish }}

  level-1:
    name: ${{ matrix.package }} (${{ matrix.system }})
    needs: [plan, level-0]
    if: ${{ !cancelled() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.depth) > 1 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.level_1) }}
    uses: ./.github/workflows/package-job.yml
    secrets: *secrets
    permissions: *permissions
    with: *package

  level-2:
    name: ${{ matrix.package }} (${{ matrix.system }})
    needs: [plan, level-1]
    if: ${{ !cancelled() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.depth) > 2 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.level_2) }}
    uses: ./.github/workflows/package-job.yml
    secrets: *secrets
    permissions: *permissions
    with: *package

  level-3:
    name: ${{ matrix.package }} (${{ matrix.system }})
    needs: [plan, level-2]
    if: ${{ !cancelled() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.depth) > 3 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.level_3) }}
    uses: ./.github/workflows/package-job.yml
    secrets: *secrets
    permissions: *permissions
    with: *package

  level-4:
    name: ${{ matrix.package }} (${{ matrix.system }})
    needs: [plan, level-3]
    if: ${{ !cancelled() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.depth) > 4 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.level_4) }}
    uses: ./.github/workflows/package-job.yml
    secrets: *secrets
    permissions: *permissions
    with: *package

  level-5:
    name: ${{ matrix.package }} (${{ matrix.system }})
    needs: [plan, level-4]
    if: ${{ !cancelled() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.depth) > 5 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.level_5) }}
    uses: ./.github/workflows/package-job.yml
    secrets: *secrets
    permissions: *permissions
    with: *package

  level-6:
    name: ${{ matrix.package }} (${{ matrix.system }})
    needs: [plan, level-5]
    if: ${{ !cancelled() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.depth) > 6 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.level_6) }}
    uses: ./.github/workflows/package-job.yml
    secrets: *secrets
    permissions: *permissions
    with: *package

  level-7:
    name: ${{ matrix.package }} (${{ matrix.system }})
    needs: [plan, level-6]
    if: ${{ !cancelled() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.depth) > 7 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.level_7) }}
    uses: ./.github/workflows/package-job.yml
    secrets: *secrets
    permissions: *permissions
    with: *package
