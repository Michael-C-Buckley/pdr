name: Upstream discovery
on:
  push:
    branches: [main]
    paths: ["rootbeer-update"]
  workflow_dispatch:
    inputs:
      rootbeer_only:
        description: Only update Rootbeer from successful main CI
        type: boolean
        default: false
  repository_dispatch:
    types: [rootbeer-update]
  schedule:
    - cron: "13 7 * * *"
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.report.outputs.changed }}
      packages: ${{ steps.select.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-engine
        with:
          runner: ubuntu-24.04
          revision-file: package-engine-revision
      - name: Check for a new CI-verified Rootbeer commit
        id: rootbeer
        env:
          GH_TOKEN: ${{ github.token }}
        run: engine-bin/rootbeer-forge ci engine --probe
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: >-
          github.event_name != 'repository_dispatch' && github.event.head_commit.message != 'ci(rootbeer): request update' && github.event.schedule != '*/15 * * * *' && inputs.rootbeer_only != true
        with:
          path: .upstream-metadata
          key: upstream-metadata-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: upstream-metadata-v1-
      - name: Prepare Rootbeer-only scan
        if: >-
          github.event_name == 'repository_dispatch' || github.event.head_commit.message == 'ci(rootbeer): request update' || github.event.schedule == '*/15 * * * *' || inputs.rootbeer_only == true
        run: |
          mkdir -p candidates
          printf '%s\n' '{"updated":[],"rules_changed":[],"errors":{},"untracked":[]}' > candidates/report.json
          printf '%s\n' '# Rootbeer update' > candidates/summary.md
      - name: Discover updates
        if: >-
          github.event_name != 'repository_dispatch' && github.event.head_commit.message != 'ci(rootbeer): request update' && github.event.schedule != '*/15 * * * *' && inputs.rootbeer_only != true
        id: discovery
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          engine-bin/rootbeer-forge --catalog packages updates \
            --cache .upstream-metadata --output candidates
      - name: Discover CI-verified Rootbeer source
        if: steps.rootbeer.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: engine-bin/rootbeer-forge ci engine
      - name: Select changed package inputs
        id: select
        env:
          BASE_REVISION: ${{ github.sha }}
        run: |
          if [ -d candidates/packages ]; then
            engine-bin/rootbeer-forge --catalog candidates/packages ci select --base "$BASE_REVISION"
          fi
      - name: Summarize candidates and exceptions
        id: report
        if: always()
        run: |
          test -f candidates/report.json
          cat candidates/summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "changed=$(jq '(.updated + .rules_changed) | length > 0' candidates/report.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.discovery.outcome != 'skipped' && github.ref == 'refs/heads/main'
        with:
          path: .upstream-metadata
          key: upstream-metadata-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: upstream-candidates
          path: candidates/
          retention-days: 14
          if-no-files-found: error
      - name: Surface discovery failures
        if: steps.discovery.outcome == 'failure'
        run: echo "::warning::Some upstreams failed; see the discovery report. Successful candidates continue independently."

  propose:
    name: Open recipe update PR
    needs: discover
    if: needs.discover.outputs.packages != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      # PRs the workflow token opens wait for someone to approve CI; the App's verify themselves.
      - name: Mint a Rootbeer Bot token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ROOTBEER_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ROOTBEER_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Read approved automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read candidate recipes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: upstream-candidates
          path: candidates
      - uses: ./.github/actions/setup-engine
        with:
          runner: ubuntu-24.04
          revision-file: package-engine-revision
      - name: Propose updates
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          PACKAGES: ${{ needs.discover.outputs.packages }}
        run: |
          # shellcheck disable=SC2086 # PACKAGES holds exact requests separated by spaces.
          engine-bin/rootbeer-forge ci propose $PACKAGES
