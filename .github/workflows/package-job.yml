name: Build and publish one package
on:
  workflow_call:
    secrets:
      PDR_SIGNING_KEY:
        description: Supplied by the package-publishing environment in the publisher job
        required: false
    inputs:
      runner:
        type: string
        required: true
      package:
        type: string
        required: true
      name:
        type: string
        required: true
      key:
        type: string
        required: true
      plan:
        description: Artifact ID of the work plan this task belongs to
        type: string
        required: true
      artifact:
        type: string
        default: ""
      error:
        type: string
        default: ""
      publish:
        type: boolean
        default: false
      reuse-run:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: package-${{ github.event_name }}-${{ github.ref }}-${{ inputs.package }}-${{ inputs.key }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.package }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      artifact: ${{ steps.retain.outputs.artifact-id }}
      key: ${{ steps.build.outputs.key || inputs.key }}
    steps:
      - name: Report unsupported package inputs
        if: inputs.error != ''
        env:
          PACKAGE_ERROR: ${{ inputs.error }}
        run: |
          printf '%s\n' "$PACKAGE_ERROR" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install verified Forge
        if: inputs.artifact == ''
        uses: ./.github/actions/setup-engine
        with:
          runner: ${{ inputs.runner }}
          revision-file: package-engine-revision
      - name: Prepare build toolchains
        if: inputs.artifact == ''
        uses: ./.github/actions/setup-package-tools
      - name: Read the work plan
        if: inputs.artifact == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ inputs.plan }}
          path: work
          merge-multiple: true
      - name: Find dependency builds from this run
        if: inputs.artifact == ''
        id: dependencies
        env:
          PACKAGE: ${{ inputs.package }}
          GH_TOKEN: ${{ github.token }}
        run: engine-bin/rootbeer-forge ci dependencies work/plan.json "$PACKAGE"
      - name: Download dependency builds
        if: steps.dependencies.outputs.ids != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.dependencies.outputs.ids }}
          path: dependency-builds
      - name: Build and check this package
        if: inputs.artifact == ''
        id: build
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          engine-bin/rootbeer-forge build work/plan.json "$PACKAGE"
          # A result published while this job was queued is kept instead of a second build.
          jq -r '"key=\(.built.key // .reused.key)", "built=\(has("built"))"' result/build.json >> "$GITHUB_OUTPUT"
      - name: Retain concurrently published package records
        if: steps.build.outputs.built == 'false'
        run: mkdir discovery-records && cp result/record.json "discovery-records/${{ steps.build.outputs.key }}.json"
      - name: Upload concurrently published package records
        if: steps.build.outputs.built == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: published-records-reuse-${{ steps.build.outputs.key }}-${{ github.run_attempt }}
          path: discovery-records/*.json
          if-no-files-found: error
      - name: Recover the admitted verified build
        if: inputs.artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ inputs.artifact }}
          run-id: ${{ inputs.reuse-run }}
          github-token: ${{ github.token }}
          path: result
          merge-multiple: true
      - name: Retain this verified build
        if: inputs.artifact != '' || steps.build.outputs.built == 'true'
        id: retain
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package-${{ steps.build.outputs.key || inputs.key }}-${{ github.run_attempt }}
          path: |
            result/package.tar.gz
            result/receipt.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish ${{ inputs.package }}
    needs: build
    if: needs.build.outputs.artifact != '' && github.ref == 'refs/heads/main' && inputs.publish && vars.PUBLISH_PDR == 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    environment: package-publishing
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Read approved recipe and publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install verified Forge
        uses: ./.github/actions/setup-engine
        with:
          runner: ${{ inputs.runner }}
          revision-file: package-engine-revision
      - name: Download this job's verified build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: result
          merge-multiple: true
      - name: Install registry client
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.0
      - name: Approve these exact inputs and sign this package
        env:
          INPUT_KEY: ${{ needs.build.outputs.key }}
          PACKAGE_REGISTRY: ${{ github.repository }}/${{ inputs.name }}
          PDR_SIGNING_KEY: ${{ secrets.PDR_SIGNING_KEY }}
          PDR_PUBLIC_KEY: ${{ vars.PDR_PUBLIC_KEY }}
        run: |
          : "${PDR_SIGNING_KEY:?The publication environment did not provide its signing key}"
          umask 077
          key="$RUNNER_TEMP/package-key.der"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$PDR_SIGNING_KEY" | base64 --decode > "$key"
          unset PDR_SIGNING_KEY
          engine-bin/rootbeer-forge --catalog packages release \
            --receipt result/receipt.json --input-key "$INPUT_KEY" \
            --registry "$PACKAGE_REGISTRY" --output release \
            --key "$key" --public-key "$PDR_PUBLIC_KEY"
      - name: Store package and signed record in GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          PDR_PUBLIC_KEY: ${{ vars.PDR_PUBLIC_KEY }}
        run: |
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          engine-bin/rootbeer-forge push release --public-key "$PDR_PUBLIC_KEY" | tee publication.txt
          cat publication.txt >> "$GITHUB_STEP_SUMMARY"
          mkdir discovery-records
          cp release/package.json "discovery-records/${{ needs.build.outputs.key }}.json"
      - name: Retain this published package record for discovery
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: published-records-${{ needs.build.outputs.key }}-${{ github.run_attempt }}
          path: discovery-records/*.json
          if-no-files-found: error
