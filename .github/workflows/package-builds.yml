name: Packages
run-name: ${{ github.event.pull_request.title || inputs.packages || 'Package updates' }}
on:
  # Every PR runs, so the required Package checks never wait on a run that was filtered out.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ["packages/**"]
  workflow_call:
    secrets:
      PDR_SIGNING_KEY:
        required: false
  workflow_dispatch:
    inputs:
      packages:
        description: Exact name@version selections; empty refreshes discovery only
        type: string
        default: ""
      reuse-run:
        description: Recover successful package builds from this approved run
        type: string
        default: ""

permissions:
  contents: read

jobs:
  select:
    name: Select changed packages
    if: >-
      github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.head_branch != 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      packages: ${{ steps.select.outputs.packages }}
      platforms: ${{ steps.select.outputs.platforms }}
      reuse-run: ${{ steps.producer.outputs.reuse-run }}
      waiting: ${{ steps.producer.outputs.waiting }}
    steps:
      - name: Read recipes and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install approved package engine
        uses: ./.github/actions/setup-engine
        with:
          runner: ubuntu-24.04
          revision-file: package-engine-revision
      - name: Find completed PR verification
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ inputs.reuse-run }}
        run: engine-bin/rootbeer-forge ci producer --reuse-run "$REUSE_RUN"
      - name: Check recipes use the layout discovery writes
        if: steps.producer.outputs.waiting != 'true'
        run: engine-bin/rootbeer-forge format --check
      - name: Compare expanded package inputs
        if: steps.producer.outputs.waiting != 'true'
        id: select
        env:
          PACKAGES: ${{ inputs.packages }}
          BASE_REVISION: ${{ steps.producer.outputs.base || github.event.pull_request.base.sha || github.event.before }}
        run: |
          # shellcheck disable=SC2086 # PACKAGES holds exact requests separated by spaces.
          engine-bin/rootbeer-forge ci select --base "$BASE_REVISION" $PACKAGES

  platform:
    needs: select
    if: needs.select.outputs.packages != '' && needs.select.outputs.waiting != 'true'
    name: ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.platforms) }}
    uses: ./.github/workflows/package-platform.yml
    secrets:
      PDR_SIGNING_KEY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.PDR_SIGNING_KEY || '' }}
    permissions:
      contents: read
      actions: read
      packages: write
    with:
      runner: ${{ matrix.runner }}
      packages: ${{ matrix.packages }}
      reuse-run: ${{ needs.select.outputs.reuse-run }}
      publish: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

  checks:
    name: Package checks
    needs: [select, platform]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected package to build and check
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq -e 'all(. == "success" or . == "skipped")' <<<"$RESULTS"

  discovery:
    name: Publish the PDR root
    needs: [select, platform]
    if: always() && !cancelled() && needs.select.result == 'success' && needs.select.outputs.waiting != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLISH_PDR == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: package-publishing
    permissions:
      contents: write
      actions: read
    steps:
      - name: Read current approved recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup-engine
        with:
          runner: ubuntu-24.04
          revision-file: package-engine-revision
      - name: Collect successful package records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: published-records-*
          path: discovery-records
          merge-multiple: true
      - name: Restore published metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git clone --depth=1 --branch gh-pages "https://github.com/$GITHUB_REPOSITORY.git" site
          mkdir -p discovery-records
          git -C site config user.name 'github-actions[bot]'
          git -C site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Merge signed records into the PDR
        env:
          GH_TOKEN: ${{ github.token }}
          PDR_SIGNING_KEY: ${{ secrets.PDR_SIGNING_KEY }}
          PDR_PUBLIC_KEY: ${{ vars.PDR_PUBLIC_KEY }}
        run: |
          : "${PDR_SIGNING_KEY:?The publication environment did not provide its signing key}"
          umask 077
          key="$RUNNER_TEMP/discovery-key.der"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$PDR_SIGNING_KEY" | base64 --decode > "$key"
          unset PDR_SIGNING_KEY
          for attempt in 1 2 3 4 5; do
            git -C site fetch --depth=1 origin gh-pages
            git -C site reset --hard FETCH_HEAD
            # v3 lives under /v3/; the frozen v2 files beside it are never rewritten.
            engine-bin/rootbeer-forge --catalog packages publish-records \
              --records discovery-records --site site/public/v3 \
              --key "$key" --public-key "$PDR_PUBLIC_KEY"
            test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
            git -C site add public
            git -C site commit -m "publish the PDR $GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
            if git -C site push origin HEAD:gh-pages; then exit 0; fi
            echo "Retrying discovery merge ($attempt/5)" >&2
          done
          echo 'The PDR changed concurrently; retry this metadata job.' >&2
          exit 1

  deploy:
    name: Deploy the PDR site
    needs: discovery
    if: always() && needs.discovery.result == 'success'
    concurrency:
      group: package-discovery-pages
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - name: Read all committed package updates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gh-pages
          path: site
          persist-credentials: false
      - name: Upload the PDR site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site/public
      - name: Deploy the PDR site
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
