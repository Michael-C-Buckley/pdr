name: Publish verified packages
on:
  workflow_run:
    workflows: [Packages]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    name: Promote merged package results
    if: github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.head_branch != 'main'
    uses: ./.github/workflows/package-builds.yml
    secrets:
      PDR_SIGNING_KEY: ${{ secrets.PDR_SIGNING_KEY }}
      ROOTBEER_BOT_PRIVATE_KEY: ${{ secrets.ROOTBEER_BOT_PRIVATE_KEY }}
    permissions:
      contents: write
      actions: read
      pull-requests: read
      packages: write
      pages: write
      id-token: write
